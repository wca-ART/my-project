<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex弹性布局</title>
    <style>
        #container {
            background-color: rgb(213, 213, 229);
            width: 500px;
            height: 300px;
            display: flex;
            /* flex-direction: row;水平布局 主轴为水平  */
            flex-direction: column;
            /* flex-start;从头排列 */
            /* flex-end:从尾部排列 */
            /* center:主轴上居中对齐 */
            /* space-around:平分剩余空间 */
            justify-content: space-between;/* 先两边贴边，再平分剩余空间 */
            align-items: center;/* 设置交叉轴上的分布为垂直居中 */
            align-items: flex-start;/* 交叉轴上从起点开始排列 */
            align-items: flex-end;/* 交叉轴上从终点开始排列 */
            align-items: center;/* 交叉轴上居中对齐 */
            align-items: stretch;/* 交叉轴上拉伸 */
            align-items: space-between;/* 交叉轴上平分剩余空间 */
            /* justify-content：管水平左右对齐（主轴）
            align-items：管垂直上下对齐（交叉轴） */
        }
        .item {
            width: 100px;
            height: 50px;
            background-color: blue;
            border: 1px solid rgb(34, 237, 149);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
